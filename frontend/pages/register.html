
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="conteiner">
        <div class="content firts-content">

            <div class="firts-column">
                <h2 class="title title-Primary">Hola de nuevo!</h2>
                <p class="description description-primary">
                    Por favor, ingresa tus credenciales para continuar.
                </p>

                <a href="../pages/login.html" class="btn btn-primary">
                    Iniciar sesión
                </a>

                <img src="../logo.png" alt="Logo" class="logo">
            </div>

            <div class="second-column">
                <h2 class="title title-second">Crear cuenta</h2>

                <p class="description description-second">
                    ¿No tienes una cuenta?
                </p>

                <p class="description description-second">
                    Usa tu email para crear una.
                </p>

                <form id="RegisterForm" class="form">

                    <label>
                        <input type="text" id="nombre"
                            placeholder="Nombre" required>
                    </label>

                    <label>
                        <input type="text" id="apellido"
                            placeholder="Apellido" required>
                    </label>

                    <label>
                        <input type="email" id="email"
                            placeholder="Correo electrónico" required>
                    </label>

                    <label>
                        <input type="tel" id="telefono"
                            placeholder="Teléfono" required>
                    </label>

                    <label>
                        <input type="password" id="contraseña"
                            placeholder="Contraseña" required>
                    </label>

                    <button type="submit" class="btn btn-second">
                        Crear cuenta
                    </button>

                </form>
            </div>

        </div>
    </div>

    <script type="module" src="../js/register.js"></script>
</body>
</html>
